[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fraude"
version = "1.0.0"
description = "Detección de fraude con tarjetas (ULB): anomalías no supervisadas frente a modelos supervisados, partición temporal, AUPRC con IC bootstrap y umbral elegido por costo en validación"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Erick Guarnizo"}]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
